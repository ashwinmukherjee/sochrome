<!doctype html>
<html lang="en" translate="no" data-typeface="%TYPEFACE%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>%BRAND_NAME%</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="referrer" content="no-referrer" />
    <!-- Never offered for machine translation: it would send the page, a person's variants included, to a server. -->
    <meta name="google" content="notranslate" />
    <meta name="description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:title" content="%BRAND_TITLE%" />
    <meta property="og:description" content="%BRAND_DESCRIPTION%" />
    <meta property="og:site_name" content="%BRAND_NAME%" />
    <meta property="og:type" content="website" />
    <!-- The link previews (npm run og draws them), absolute as previews require: a square for most apps, which
         crop to a square or show it whole; the wide one for X's large card. -->
    <meta property="og:image" content="https://%BRAND_DOMAIN%/og-square.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="1200" />
    <meta property="og:image:alt" content="The 23 chromosomes as bars, with the 2,132 genes checked marked on them." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%BRAND_TITLE%" />
    <meta name="twitter:description" content="%BRAND_DESCRIPTION%" />
    <meta name="twitter:image" content="https://%BRAND_DOMAIN%/og-wide.png" />
    <meta name="twitter:image:alt" content="The 23 chromosomes as bars, with the 2,132 genes checked marked on them." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
